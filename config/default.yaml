agent_provider: anthropic
code_runner_enabled: true       # POST /api/playwright/execute (runs Python on this machine)
code_runner_allow_remote: false # keep false: only local callers may use the code runner
model: claude-opus-4-8
effort: medium                  # speed/quality balance; high|xhigh for hard sites, low for fastest
max_tokens: 8192
browser:
  headless: false          # headful locally; override with AIWEBTEST_BROWSER__HEADLESS=true in CI
  channel: chrome
  viewport:
    width: 1280
    height: 800
  nav_timeout_ms: 30000
  action_timeout_ms: 10000
agent:
  max_steps: 40
  max_retries: 2
  include_screenshots: true   # vision on/off
  allowed_domains: []         # empty = derived from target_url
report:
  output_dir: runs
data: {}                      # default base test data merged into every run
