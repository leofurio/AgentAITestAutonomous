agent_provider: anthropic
code_runner_enabled: true       # POST /api/playwright/execute (runs Python on this machine)
code_runner_allow_remote: false # keep false: only local callers may use the code runner
model: claude-opus-4-8
log_level: INFO                 # set DEBUG to trace normalization and every agent (LLM) call
normalizer_provider: ""         # provider for the instruction normalizer (empty = agent_provider)
normalizer_model: ""            # model for the instruction normalizer (empty = model)
normalizer_max_tokens: 1024     # tight output cap → compact spec, fewer downstream input tokens
normalizer_effort: low          # effort for the normalizer rewrite (empty = reuse effort)
effort: medium                  # speed/quality balance; high|xhigh for hard sites, low for fastest
max_tokens: 8192
browser:
  headless: false          # headful locally; override with AIWEBTEST_BROWSER__HEADLESS=true in CI
  channel: chrome
  viewport:
    width: 1280
    height: 800
  nav_timeout_ms: 30000
  action_timeout_ms: 10000
agent:
  max_steps: 100              # hard cap on agent tool calls per run; raise for long flows
  max_retries: 2
  include_screenshots: true   # vision on/off
  allowed_domains: []         # empty = derived from target_url
  normalize_instruction: true # rewrite the request into a canonical spec for determinism
  localized_repair: true      # on an auto-replay error, heal the failing step in-process before a full re-run
report:
  output_dir: runs
data: {}                      # default base test data merged into every run
